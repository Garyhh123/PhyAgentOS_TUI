[project]
name = "phyagentos-tui"
version = "0.1.0"
description = "Official Textual terminal interface for PhyAgentOS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PhyAgentOS contributors"}
]
keywords = ["PhyAgentOS", "terminal-ui", "textual", "agent", "embodied-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "PhyAgentOS-ai @ git+https://github.com/PhyAgentOS/PhyAgentOS-core.git@dev",
    "textual>=8.2.0,<9.0.0",
    "rich>=14.0.0,<15.0.0",
    "PyYAML>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
paos-tui = "phyagentos_tui.app:run_tui"

[project.urls]
Homepage = "https://github.com/PhyAgentOS/PhyAgentOS-core"
Repository = "https://github.com/PhyAgentOS/PhyAgentOS-TUI"
Documentation = "https://github.com/PhyAgentOS/PhyAgentOS-core/tree/dev/docs"
Issues = "https://github.com/PhyAgentOS/PhyAgentOS-TUI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["phyagentos_tui"]

[tool.hatch.build]
include = [
    "phyagentos_tui/**/*.py",
    "phyagentos_tui/**/*.tcss",
]

[tool.hatch.build.targets.sdist]
include = [
    "phyagentos_tui/",
    "tests/",
    "README.md",
    "README_zh.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
