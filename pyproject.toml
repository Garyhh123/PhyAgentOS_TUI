[project]
name = "phyagentos-tui"
version = "0.1.0"
description = "Standalone Terminal User Interface for PhyAgentOS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PhyAgentOS contributors"}
]
dependencies = [
    "PhyAgentOS-ai @ git+https://github.com/PhyAgentOS/PhyAgentOS-core.git@dev",
    "textual>=8.2.0,<9.0.0",
    "rich>=14.0.0,<15.0.0",
    "PyYAML>=6.0.0,<7.0.0",
]

[project.scripts]
paos-tui = "phyagentos_tui.app:run_tui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["phyagentos_tui"]

[tool.hatch.build]
include = [
    "phyagentos_tui/**/*.py",
    "phyagentos_tui/**/*.tcss",
]

[tool.ruff]
line-length = 100
target-version = "py311"
