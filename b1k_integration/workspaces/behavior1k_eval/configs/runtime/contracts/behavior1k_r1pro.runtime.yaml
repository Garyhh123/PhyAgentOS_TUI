version: runtime_target_contract_v1
target_id: behavior1k_r1pro_sim
target_adapter: target_adapter://behavior1k_openpi_adapter
observation:
  schema_source: target.describe
  require_describe_observation_schema: true
  allow_extra_channels: true
  timestamp_required: false
action_contract:
  id: behavior1k_r1pro_joint_v1
  accepted_representations:
    - joint_position
  shape:
    - T
    - 23
  dtype: float32
  normalized: false
  frame: robot
  control_mode: joint_position
  control_hz: 20
  components:
    - {name: base, unit: normalized, size: 3}
    - {name: torso, unit: normalized, size: 4}
    - {name: left_arm, unit: normalized, size: 7}
    - {name: left_gripper, unit: normalized, size: 1}
    - {name: right_arm, unit: normalized, size: 7}
    - {name: right_gripper, unit: normalized, size: 1}
  chunk:
    max_chunk_size: 50
    preferred_chunk_size: 8
    preferred_replan_after_steps: 1
    switch_policy: hard_switch
safety:
  require_target_side_validation: true
  stop_on_nan: true
  stop_on_timeout: true
capabilities:
  available_bridges:
    - bridge://safety_clamp
  benchmark:
    name: BEHAVIOR-1K
    describe_includes_task_list: true
    status_includes_episode_summary: true
  tf_frames:
    - robot_base
